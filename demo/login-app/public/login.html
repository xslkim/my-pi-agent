<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>最小登录应用</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      display: flex;
      justify-content: center;
      padding-top: 8vh;
      margin: 0;
    }
    main { width: 340px; }
    h1 { font-size: 22px; text-align: center; margin-bottom: 24px; }
    .card {
      background: #fff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
      margin-bottom: 16px;
    }
    h2 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; font-size: 13px; color: #555; margin-bottom: 10px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      margin-top: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 9px 0;
      background: #2563eb;
      color: #fff;
      border: 0;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .msg { min-height: 18px; font-size: 13px; margin: 8px 0; }
    .msg.error { color: #dc2626; }
    .msg.success { color: #16a34a; }
    #hello { font-size: 18px; margin: 0 0 16px; }
  </style>
</head>
<body>
  <main>
    <h1>最小登录应用</h1>

    <div id="auth-view">
      <div class="card">
        <h2>登录</h2>
        <form id="login-form">
          <label>用户名<input name="username" autocomplete="username" required /></label>
          <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
          <p class="msg" id="login-msg" role="alert"></p>
          <button type="submit">登录</button>
        </form>
      </div>

      <div class="card">
        <h2>注册</h2>
        <form id="register-form">
          <label>用户名<input name="username" autocomplete="username" required /></label>
          <label>密码<input name="password" type="password" autocomplete="new-password" required /></label>
          <p class="msg" id="register-msg" role="alert"></p>
          <button type="submit">注册</button>
        </form>
      </div>
    </div>

    <div id="me-view" class="card" hidden>
      <p id="hello"></p>
      <button id="logout-btn" type="button">登出</button>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
