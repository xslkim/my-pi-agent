<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>最小登录应用</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: #1f2328;
    }
    .card {
      width: 100%;
      max-width: 360px;
      margin: 16px;
      padding: 28px 28px 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 20px; font-size: 20px; text-align: center; }
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      flex: 1;
      padding: 8px 0;
      font-size: 14px;
      color: #57606a;
      background: transparent;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab.active { color: #fff; background: #1677ff; border-color: #1677ff; }
    form { display: flex; flex-direction: column; gap: 12px; }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #57606a; }
    input {
      padding: 9px 10px;
      font-size: 14px;
      color: inherit;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
    }
    input:focus { outline: none; border-color: #1677ff; box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.15); }
    .primary {
      padding: 10px 0;
      font-size: 14px;
      color: #fff;
      background: #1677ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .primary:hover { background: #0958d9; }
    #msg { min-height: 1em; margin: 12px 0 0; font-size: 13px; text-align: center; }
    #msg.error { color: #d93025; }
    #msg.success { color: #188038; }
    #user-area { display: flex; flex-direction: column; gap: 14px; align-items: center; padding: 8px 0 4px; }
    #greeting { margin: 0; font-size: 18px; font-weight: 600; text-align: center; word-break: break-all; }
  </style>
</head>
<body>
  <main class="card">
    <h1>最小登录应用</h1>

    <!-- 未登录:登录 / 注册 -->
    <section id="auth-area">
      <div class="tabs">
        <button type="button" id="tab-login" class="tab active">登录</button>
        <button type="button" id="tab-register" class="tab">注册</button>
      </div>

      <form id="login-form">
        <label>用户名
          <input name="username" autocomplete="username" required />
        </label>
        <label>密码
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="primary">登录</button>
      </form>

      <form id="register-form" hidden>
        <label>用户名
          <input name="username" autocomplete="username" required />
        </label>
        <label>密码
          <input name="password" type="password" autocomplete="new-password" required />
        </label>
        <button type="submit" class="primary">注册</button>
      </form>

      <p id="msg" hidden></p>
    </section>

    <!-- 已登录 -->
    <section id="user-area" hidden>
      <p id="greeting"></p>
      <button type="button" id="logout-btn" class="primary">登出</button>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
